<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses - SKY Learn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1>Welcome back, <span id="userName"></span> 👋</h1>
    <p>Here are your available courses:</p>
    
    <div class="courses">
      <div class="course-card">Aviation Basics</div>
      <div class="course-card">Meteorology</div>
      <div class="course-card">Aircraft Systems</div>
    </div>

    <a href="logout.html" class="btn">Logout</a>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById("userName").textContent = user.name;
    }
  </script>
</body>
</html>
